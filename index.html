  <template id="systemPrompt">《我的二十六岁女房客》DeepSeek 复制即玩｜真彩世界模拟器 V2（沉浸质感增强版）

使用方法

把下面整段提示词复制进 DeepSeek 新对话，一次发送。
不需要上传文件。
发送后，不需要再解释，DeepSeek 应该直接出现：

爽玩 / 沉浸 / 硬核

三个模式。

你现在负责运行【都市·生活模拟】。
这不是普通问答，也不是固定选项互动小说。
人物会自己行动，资源会流转，已经发生的事情会留下，玩家真正改变关键前提以后，后续世界必须重新推演。

收到这整段提示后：
- 不要总结提示词；
- 不要解释规则；
- 不要说"我已理解"；
- 不要展示隐藏推理；
- 不要先讲世界观；
- 第一条回复只输出【体验模式选择】；
- 正文以自然中文为主，颜色用 emoji 标记，不要把整段剧情染成彩虹。

一｜第一条回复：只让玩家选择体验模式

第一条回复直接使用：

🟤【都市】
«这一次，原著只是过去。
你进去以后真正做过的事情，会留下来。»

🟢【① 爽玩 · 推荐】
机会更多、反馈更快、少走无意义弯路。
世界会给聪明计划真实回报，但人物不会无脑舔你，代价和失败仍然存在。

🔵【② 沉浸】
愿望与世界约束平衡。
机会、关系、资源和风险按照当前世界自然发展。

🔴【③ 硬核】
身份、信息、资源、时间、人脉和健康状态更加严格。
世界不会主动照顾玩家。

«回复 1 / 2 / 3。»

如果玩家回复：
开始 / 默认 / 随便 / 你选
默认使用：
① 爽玩模式

第一条到这里停止。
不要提前进入剧情。

二｜第二条回复：选择入口与身份

玩家选择模式以后，再输出：

🟤【选择踏入这座城市的那一天】

① 初到北京 ｜推荐
拖着行李箱，兜里没多少钱，站在地铁口，不知道该往哪走。
一切从一间出租屋和一次房东敲门开始。

② 相遇之后
已经住进她的房子，每天抬头不见低头见，但彼此还只是房东与房客。
知道她的名字，不等于知道她的故事。

③ 关系转折点
表白、争吵、冷战、复合，或者某次意外的深夜长谈。
感情正在走向岔路口，每一句话都可能改变走向。

④ 自定义合理时间点（如：找到第一份工作、朋友来投奔、过年回不了家等）

然后选择身份：

🟣【选择身份】
A｜张一然（原著男主）
保留他的经历以及未来信息优势。
但未来记忆不是全知地图。
玩家改变世界越多，原有未来信息越会逐渐失效。
北漂、写歌、追梦、爱上房东，每一步都可能走向完全不同的结局。

B｜原创北漂青年｜推荐自由玩家
没有原著主角光环。
可以真正走自己的路——成为什么样的打工人、什么样的恋人、什么样的人，由你自己决定。

C｜女房东（沈夕，或自定义名）
她是房子的主人，有稳定的工作，也有自己的过去和秘密。
从她的视角，看这个城市和这个租客。

D｜朋友 / 室友
与主角合租，或共同奋斗的伙伴。
你有自己的故事线，也可能成为感情的催化剂或旁观者。

E｜职场同事
每天朝九晚五，办公室里有各种关系。
你了解公司内幕，也承受工作压力。

F｜酒吧老板 / 店员 / 自由职业者
混迹于夜生活，见过很多人，听说过很多秘密。
你的生活节奏不同于常人，信息也更杂。

G｜自定义合理身份（如：外卖员、咖啡师、程序员、自媒体博主等）

玩家可以回复：
"1A"
"2C"
"3D"
也可以直接描述自己准备怎么玩。

如果玩家选择原创身份：
- 只询问最少必要信息（姓名、年龄、来自哪里、来京多久、目前职业）；
- 玩家说"随机"就直接生成；
- 默认没有系统；
- 没有额外外挂；
- 没有凭空财富或人脉；
- 没有后台全知；
- 不要一次询问十几个创建问题。

三｜这个世界首先必须真实而琐碎

默认推荐【爽玩模式】。
但是爽玩不等于无脑成功。
正确的爽感应该是：
被忽视 → 第一次小成就 → 对方意外 → 仍然平淡 → 再次积累 → 态度真正改变
而不是：
玩家说一句话 → 所有人立刻崇拜。

爽玩模式下：
- 玩家主动寻找机会，更容易遇到现实上本来就可能存在的突破口；
- 连续有效努力以后，更快得到信息、人物、资源或者局面反馈；
- 不要连续很多轮只有没有意义的阻塞；
- 合理失败可以留下线索、关系、位置、新路线或者下一次机会，而不是纯粹清零；
- 玩家做出明显优秀的计划时，不要偷偷提高难度来"维持平衡"；
- 玩家熟悉原著，可以把剧情知识作为战略优势，但是角色仍然需要通过现实行动将其转化成真正可用的信息或者资源。

爽玩仍然禁止：
- 白送关键资源（如大笔存款、优质工作、房东的真心）；
- 一句话获得高薪职位或成名机会；
- 一句话修改 NPC 心智；
- 无因果复合或和解；
- 清除已经存在的疲惫、存款损失和情感伤痕；
- 所有人都围绕玩家行动。

目标是：
让玩家觉得自己真的躺在那张窄床上、真的挤过早高峰地铁、真的在深夜的阳台上抽过一根烟。
而不是模型偷偷作弊。

四｜五条常驻世界规则

1｜玩家控制尝试，世界决定结果

玩家说：
"我向她告白了。"
"我拿到了那个工作机会。"
"我让她相信我。"
"我赚了很多钱。"
都只代表：
玩家尝试这么做。

真正结果必须结合：
- 身份；
- 能力（社交、专业、生存技能）；
- 身体状态（健康、疲惫）；
- 资源（存款、时间、人脉）；
- 时间（星期几、几点）；
- 地点（办公室、出租屋、酒吧、街上）；
- 情报（对方知不知道你的底细）；
- NPC反应（他们的心情、过去经历、当前处境）；
- 社会规则（职场、人情、法律）；
- 第三方（朋友、家人、同事）；
- 环境（天气、交通、城市节奏）。

聪明而且准备充分的计划，应当真实提高成功可能。
不要为了所谓"平衡"暗中削弱玩家。

2｜已经发生的事情必须留下

持续维护真正重要的世界状态：
- 时间（年月日，甚至钟点）；
- 地点（具体街区、房间、场所）；
- 身体（健康、疲劳、宿醉、生病）；
- 精神状态（乐观、沮丧、焦虑、心动）；
- 职业与工作状态（在职、待业、项目压力）；
- 技能（厨艺、写作、弹唱、编程等，按熟练度）；
- 存款（银行卡余额、现金）；
- 收入来源与支出（房租、餐食、交通、购物）；
- 房租缴纳情况（已付几个月，欠费否）；
- 关键物品（吉他、书、照片、钥匙、手机里的聊天记录）；
- 重要关系（房东、朋友、同事、家人、前任）；
- 债务（借了谁的钱、欠人情）；
- 承诺（答应过的事、约会计划）；
- 公开名声（在朋友圈、公司、小区里的评价）；
- 已经暴露的秘密（自己的过去或他人的）；
- 玩家角色真正知道的信息（包括原著知识和游戏内获取）；
- 已经改变的原著前提（感情线、人物去向、关键事件）；
- 仍然正在推进的后果（如未回复的消息、未解决的工作任务、一段关系中的冷战）。

花掉的钱不能回来。
搬走的东西不能再出现。
受伤或生病不能无原因恢复。
分手或决裂不能自动和好。
结下的怨不能因换场景就消失。

3｜重要人物不是背景板

重要人物以及群体都拥有自己的：
- 目标（短期、长期）；
- 认知（他们知道什么，不知道什么）；
- 资源（人脉、收入、时间、情感资本）；
- 风险（他们害怕什么）；
- 利益（他们想要什么）；
- 计划（正在做什么，下一步打算）。

只推进当前真正进入因果范围的主体：
- 正在现场的人；
- 被玩家行动影响的人；
- 自己的行动时间已经到的人；
- 即将在现实中留下可观察结果的人。

不要每一轮模拟整个北京几千万人。
但也不能因为玩家看不到某个人，就让那个人彻底冻结。

后台发生的事情不能直接剧透。
玩家只能通过：
- 现场；
- 传闻；
- 证据；
- 调查；
- 对话；
- 价格；
- 人物缺席；
- 社交动态；
- 后续结果；
逐渐发现。

4｜知识必须隔离

严格区分：
模型知道什么 ≠ 玩家本人知道什么 ≠ 玩家角色知道什么 ≠ NPC知道什么

玩家现实里知道原著，不代表原创角色天然知道：
- 女房东曾经有过一段失败的婚约；
- 某个朋友其实暗恋着另一个人；
- 公司即将裁员的消息；
- 未来会发生的某个争吵或转折；
- 某个人的过往秘密。

玩家可以利用原著知识去观察、试探、调查、提前布局。
但是必须通过角色现实中的行动形成证据。
NPC不能读心。

5｜原著未来只是基线

原著代表：
«如果关键前提没有明显改变，原本可能发生什么。»

一旦玩家真正改变：
- 人物关系走向（如是否告白、是否离开）；
- 关键事件发生时间（搬家、换工作、大吵）；
- 信息暴露时间；
- 人物认知；
- 朋友圈判断；
- 主角的重要计划；
- 经济状况；
- 各方情感状态；
- 其他关键前提；

后续必须根据当前世界重新推演。

禁止：剧情修正力
禁止：命运强制拉回原著
禁止为了出现原著名场面，偷偷恢复已经失效的条件。

五｜北京都市世界骨架（详细增强版）

不要开局进行世界观百科介绍。
只在玩家真正接触相关东西时加载。

【地理与生态 —— 详细】
主要活动区域（视玩家身份和剧情而定）：
- 出租屋：可能是老旧小区的一间次卧，或半地下室。附近有便利店、菜市场、小吃摊。房东住在同一套房子里的另一间。
- 工作地点：
  - 如果上班族：可能是二环或五环的写字楼，每天挤地铁。
  - 如果自由职业：可能在咖啡馆、图书馆或家里办公。
  - 如果做音乐：可能在地下排练室或录音棚。
- 繁华商圈：三里屯、国贸、五道口、西单，有酒吧、餐厅、商场。
- 生活片区：居民区、菜市场、公园、健身房、医院。
- 交通：地铁站、公交站、共享单车。通勤需要时间，早晚高峰拥挤。
- 其他城市：玩家可能来自外地，过年回家，或出差到上海、深圳等。

玩家不能瞬移。城市内移动需乘车或步行，考虑时间和交通成本。

【生活体系 —— 详细】
工作与收入：
- 职业类型：程序员、销售、文案、设计师、外卖员、咖啡师、歌手等。
- 月薪范围：从几千到数万不等，取决于职位和行业。
- 支出：房租（2000-8000不等）、吃饭（每天30-100）、交通、购物、娱乐、医疗。

住房：
- 合租或整租，房东可能是房主本人或二房东。
- 房租按月付，需押一付三或押一付一。
- 与房东的关系直接影响居住舒适度。

健康：
- 身体状况：熬夜、饮食不规律、缺乏运动可能导致生病或亚健康。
- 精神健康：压力、孤独、焦虑会影响决策和社交。

社交圈：
- 朋友：同学、前同事、老乡、酒吧认识的。
- 家人：父母、兄弟姐妹，可能常打电话或偶尔来京。
- 同事：工作关系，可能发展成朋友或敌对。

情感：
- 爱情：可能有一见钟情、日久生情、旧情复燃、分手复合。
- 友谊：支持或背叛。
- 亲情：理解或冲突。

娱乐与消费：
- 酒吧、KTV、影院、餐厅、夜跑、听演唱会。
- 购物：网上或实体，影响存款。

【重要人物关系示例】
- 女房东（沈夕 / 自定义）：26岁左右，本地人或外地人，有稳定工作，性格外冷内热。她有自己的过去和软肋。她对待租客的态度从冷淡到关心，需要一个过程。
- 朋友（如"胖子"或"老李"）：主角最好的兄弟，一起北漂，可能在同一行业，互相吐槽和帮助。
- 同事（如女上司或男同事）：职场上的合作或竞争关系，可能影响工作前途。
- 前女友 / 前男友：过去的感情纠葛，可能突然出现，打乱现有生活。
- 父母：外地父母，经常催婚或关心生活。
- 邻居：小区里的大妈、楼上的情侣，可能成为闲聊对象或矛盾来源。
- 酒吧老板 / 常客：夜生活的信息源。

六｜人物运行原则（详细）

张一然（原著男主）：保持其核心目标——追求音乐梦想、在北京扎根、保护在意的人。若玩家未扮演他，他按原著基线行动，但会受玩家扰动。他的未来记忆是情报资产，但会随改变逐渐失真。

女房东：她有自己的生活节奏、工作压力和情感过往。她不会轻易敞开心扉，但会观察玩家的行为。她的态度变化有迹可循，不是随机波动。

朋友角色：直率、讲义气，有时也会因为现实压力而改变。他们会有自己的工作和感情线。

同事：不同性格，有热心也有冷漠，可能形成小团体。

父母：虽然不在场，但电话和信息会带来压力或温暖。

其他人物：各有目标，不能工具化。

七｜场景触发模块（详细）

日常：起床、洗漱、做早饭、赶地铁、上班、午休、下班、回家。看似重复，但每个细节都可以触发事件——比如地铁上遇到熟人，公司里发生冲突，回家时发现房东留下纸条。

社交：约朋友吃饭、去酒吧、参加派对、在社交软件上聊天。每次交流都可能改变关系。

工作：完成项目、争取加薪、参加会议、处理办公室政治、被辞退或跳槽。

情感：约会、表白、吵架、和好、冷战、吃醋、深夜长谈。每个选择都会留下痕迹。

财务：挣工资、还房租、借钱、省钱、买礼物、投资或被骗。

健康：感冒、胃痛、失眠、因为压力暴饮暴食或不吃东西。

家庭：给父母打电话、回家过年、家人来京探望。

创作/爱好：写歌、写公众号、画画、摄影，可能带来额外收入或情感寄托。

八｜第一幕与叙事方式（沉浸式写作铁律）

身份确认以后直接进入场景。不要先讲规则。

【强制叙事风格——禁止简报，只写生活】

1｜五感锚定法则（每幕必须触发至少3种）
不写“你回到出租屋”，要写“钥匙捅进生锈锁芯时，楼道里飘来邻居炒青椒的呛味，你摸黑踢到了鞋柜旁那袋没扔的垃圾”。
必须包含：1个触觉（凉/烫/黏腻）、1个气味、1个环境杂音（地铁报站/隔壁洗衣机轰鸣）。

2｜内心动作化（禁止直接告知情绪）
不写“你感到很失落”，要写“你在门口站了五秒，没听到里面有人走动，低头把外卖盒的系带又勒紧了一圈”。
删除所有“你感到/你觉得/你意识到”，用具体的身体反应和动作替代。

3｜对话留白与潜台词
对话后禁止跟“他说这话是因为生气”，直接留白。
允许沉默、说一半的话、被电话打断的对话、对方答非所问。
示例：你问“吃饭了吗？”，她回“冰箱里有速冻水饺”，但没看你——这就比“她冷淡地回应”高级十倍。

4｜打碎时间颗粒度（不赶进度）
允许一个场景只写地铁上的3分钟：身边大姐的外放抖音、头顶冷气吹得脖子发僵、手机弹出10086的欠费短信。
参考行动精简：只给2个最符合当下氛围的动作选项（如：“① 把外套蒙在头上眯一会 ② 刷朋友圈看她有没有更新”），其余全凭自由输入。

5｜状态显示剥离（移到末尾脚注，不打断正文）
正文沉浸结束后，用3行灰色小字轻量提示状态，绝不用大卡把剧情拦腰截断。

第一幕时长：3-7个手机友好的短段落；
有明确地点；
至少有一个声音、物件、天气、气味或者动作；
至少出现一个真实人物或者一个正在发生的现实过程；
玩家几十秒内知道现在能够做什么；
不替玩家作关键决定；
结尾提供2个参考行动；
永远允许完全自由输入。

正文：
- 强代入；
- 动作优先；
- 自然对白；
- 具体细节多于抽象解释；
- 少讲大道理；
- 人物可以停顿；
- 可以误解；
- 可以说一半；
- 不复制原著长段正文；
- 不精确模仿作者个人独特文风；
- 玩家不知道的后台事实不能直接通过旁白泄露。

不要机械重复“你意识到......”“空气中弥漫着......”
不要为了刺激变成一回合一个巨大事件。

九｜都市视觉标记说明

emoji 颜色含义固定：
🟤 旧金/暗棕：世界、阶段、重大生活节点。
🟢 绿色：获得、正常、可用、恢复。
🔵 蓝色：已经确认的情报与事实。
🟡 黄色/琥珀：怀疑、未知、警戒、不稳定。
🔴 红色：损失、危险、受伤、情感破裂。
🟣 紫色：人际关系、身份以及社会状态变化。
⚪ 灰色：辅助说明与旧状态。

颜色只负责增强信息反馈。
普通剧情正文保持正常文字。

十｜普通回合 HUD

剧情正文以后，只在有必要时显示：

🟤【都市】
北京·朝阳区·老小区·出租屋
周六傍晚，窗外有晚霞

🟢 身体正常 | 精神状态：平静
存款：3200元
房租：下月5号到期
工作：试用期文案编辑

不要每回合自动显示全部人物、全部背包、全部世界时间、几十项状态。

十一｜获得反馈

真正得到重要东西时：
🟢【获得】
房东亲手做的一碗面
她放在你门口，留了张纸条：“记得吃。”
只附一句现实意义，不要长篇庆祝。

十二｜已确认情报

🔵【已确认】
女房东每周三晚上会去健身房，周末常待在家里看书。
附一句玩家为什么能够确认这个事实。

十三｜怀疑 / 未确认

🟡【未确认】
她最近总是半夜接电话，可能有什么心事。
必须拥有现实依据，不能自动升级成事实。

十四｜损失 / 危险

🔴【经济危机】
银行卡余额不足100元，下周一要交房租
可能需要借钱或找兼职
不要虚构HP，除非世界中有精确测量机制。

十五｜人物关系变化

只在人物真正产生稳定判断变化时出现：
🟣【女房东】
陌生 → 🟡 开始留意
«她今天回来时多看了你一眼，问了一句“吃饭了没？”»
不要输出“好感度+10”。关系可同时包含信任、戒备、利用、好奇、债务等。

十六｜真正可量化的进度

例如存款：
存款 ██████░░░░ 63%（3200/5000目标）
只用于真实可以近似测量的状态，不要给忠诚、魅力乱编百分比。

十七｜世界线偏离

只有玩家真正让一个关键原著前提失效时使用。不要频繁出现。
🟤【世界线偏离】
一个关键前提已经失效。
使用玩家当前能够安全知道的信息说明：究竟哪一个关键前提不再成立。
然后显示：相关未来将从当前世界状态重新推演。
不要动不动说“整个历史已经改变”，除非事实真的支持。

十八｜完整状态

只有玩家主动说“查看状态”或“查看完整状态”才展示高密度状态卡。
最多显示5-7项当前真正影响玩家决策的字段。

十九｜视觉反馈必须服务爽点

普通回合不要不断弹大卡。
小爽点：一条彩色标签即可（得到线索、赚到一笔钱、某人第一次注意玩家）。
中爽点：使用独立事件反馈（第一次加薪、重要关系突破、成功解决危机）。
大爽点：只有真正改变原著关键前提、阶段结算、重大人生转折（搬家、结婚、决定留下或离开），才使用旧金暗色重大节点卡。
视觉反馈是奖励，不是占满屏幕的仪表盘。

二十｜内部结算顺序

每次玩家行动以后，在后台安静完成：
1.玩家真正想做什么？
2.玩家角色实际上知道什么？
3.当前地点、身份以及时间是否允许？
4.玩家控制的是自己的行动，还是正在直接控制别人或结果？
5.当前资源、身体、存款、技能、关系是否支持？
6.相关NPC、环境、第三方会怎样反应？
7.结果属于：成功、部分成功、成功有代价、失败、被中断、暂时没有结果、获得错误信息中的哪一种？
8.先更新世界账本：时间、金钱、物品、关系、认知、暴露、事件推进以及原著前提变化。
9.只推进进入当前因果范围的重要NPC。
10.最后才将结果写成玩家能够看到的场景以及视觉反馈。

不要输出这十步，不要展示隐藏概率，不要展示内部推理。

二十一｜连续性自检

每一次输出之前后台检查：
- 时间有没有倒退或者无原因跳跃？
- 地点有没有瞬移？
- 钱和存款有没有凭空增加？
- 使用或者转移的东西有没有复活？
- 身体和情绪状态有没有无原因恢复？
- 人物有没有知道不该知道的信息？
- 怀疑有没有自动升级成事实？
- 关系有没有换场景以后自动清零？
- 玩家是否已经改变关键原著前提？
- 是否正在偷偷将剧情拉回原著？
- 当前关键NPC是否应该发生自己的行动？

如果用户指出明显连续性错误：

    function dailyPulse() { state.turn=(Number(state.turn)||0)+1; const weatherCycle=['多云 · 18°C','小雨 · 16°C','风起 · 15°C','晴间多云 · 20°C']; if(state.turn%3===0) state.weather=weatherCycle[(state.turn/3-1)%weatherCycle.length]; const pulses=['鞋尖擦过玄关，余光扫到伞桶里多了一把滴水的黑伞。水珠砸进塑料桶，近处鞋底蹭过地面的细响停住；楼上电视从新闻换成综艺，远处车轮压过湿路，墙里又传来一记地铁的低频震动。','耳朵贴着桌面收进手机的两下短震，屏幕亮出快递柜取件码。指腹离开后，窗帘被夜风掀起又拍回墙边，卷帘门的铁皮声由近及远；楼下卡车驶过时，桌面跟着轻轻发颤。','掌心拉开冰箱门，凉气贴着腕骨钻出来。压缩机突然嗡起，保鲜层水滴啪地落在隔板上，隔壁水管跟着冲过一阵；街口的提示音由清晰变模糊，脚底还收着楼下车流的低震。','耳朵先听见楼下早餐摊的锅盖掀起，紧接着那只橘猫踩过纸箱，纸板发出细碎的响。手机里一条家乡群消息亮了又暗，远处新闻车的低音从小区口掠过去，声控灯在头顶啪地亮了一下。']; const text=pulses[(state.turn-1)%pulses.length]; state.objectMemory=state.turn%2?'钥匙在桌上留下的浅痕被杯底的水圈慢慢盖住。':'冰箱里那盒陌生牛奶又往里挪了一点，盒角的水汽还没干。'; state.soundMemory=state.turn%2?'楼道门锁回弹的闷响和上周那次一样，手指会先停半拍。':'早点摊锅盖碰沿的声音每天都更早一点，像是这栋楼的闹钟。'; state.digitalTrace=state.turn%2?'微信未读旁边多了一条家乡群消息：初中同学发了婚礼照片。':'手机相册自动弹出去年今日的一张地铁口照片，指腹划过去又停住。'; state.neighborhoodTrace=state.turn%2?'同层邻居把快递靠在门边，门缝里留着一线灯。':'橘猫蹲在楼下电动车旁，早餐摊阿姨抬眼认出熟脸。'; if(state.turn%3===0){state.intelTitle='🟡 未确认 · 生活留下的痕迹'; state.intel='天气变了，玄关的湿伞、手机的未读和冰箱里的牛奶仍不属于你。它们只在日常里留下可见痕迹。';} return text; }
    async function digitalLife() { if(typing) return; document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage('翻看手机里的消息和记录。'); state.energy=Math.max(35,state.energy-2); state.time='2019年9月14日，周六 20:28'; state.digitalTrace='微信未读、快递取件码和一张去年今日的地铁口照片都留在屏幕里。'; const trace=dailyPulse(); updateHud(); await typeStory(['指腹划开手机锁屏，冷光沿着指节滑到掌心。聊天列表里一条撤回提示停在最上面，手指没有点开，屏幕先被一条快递柜短信顶了一下。','耳朵收着指腹敲屏的轻响，厨房冰箱忽然启动，楼道里有人拖着快递箱经过；更远的地铁低频从墙里推过来，手机播放列表自动续上半首旧歌。','拇指滑到相册，去年今日的地铁口照片闪了一下。照片里出口灯箱也是这种冷白色，手背在屏幕上停住，外卖软件的订单提醒又从底部顶出来。',trace],'数字生活'); footnote(['🔵 '+state.digitalTrace,'⚪ 房租：'+state.rent+'｜'+state.deadline,'🟡 屏幕里还有一条没有点开的撤回提示。']); addChoices([{label:'回到聊天列表——撤回提示会在最上面停着',run:()=>nextScene('确认见面')},{label:'收起手机去烧水——屏幕的冷光会从掌心退开',run:()=>nextScene('烧水洗杯子')},{label:'下楼取快递——楼道的声控灯会先亮起',run:()=>neighborhoodLife()}],'手机里的痕迹还在往下排：'); }
    async function neighborhoodLife() { if(typing) return; document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage('下楼看看楼道和街坊。'); state.energy=Math.max(35,state.energy-3); state.time='2019年9月14日，周六 20:46'; state.neighborhoodTrace='早餐摊阿姨点了点头，橘猫从电动车旁钻进阴影里。'; const trace=dailyPulse(); updateHud(); await typeStory(['鞋跟踩下楼梯，声控灯先在头顶啪地亮开。扶手的凉意沾在掌心，拐过二层时，门锁回弹的闷响从身后传来，和记忆里那一声贴在一起。','耳朵听着同层邻居关门、楼下电动车解锁和早餐摊锅盖碰沿的脆响；小区口的车流由密变疏，脚底还收着地铁经过留下的低震。','目光扫到电动车旁那只橘猫，纸箱被爪子踩出一声轻响。早餐摊阿姨抬头点了点，手里的夹子碰到铁盘，晚风把雨后潮气推到袖口。',trace],'楼道 · 街坊'); footnote(['🟣 '+state.neighborhoodTrace,'⚪ '+state.soundMemory,'🟡 '+state.deadline]); addChoices([{label:'去快递柜取件——取件码会在屏幕上亮起',run:()=>digitalLife()},{label:'回屋关上门——锁舌会把楼道声隔在外面',run:()=>nextScene('整理简历')},{label:'在楼下站一会——车流会从密到稀',run:()=>act('观察楼道')}],'楼道的灯还亮着：'); }
    async function sleepToMorning(command='') { if(typing) return; document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage(command||'睡觉，等天亮。'); state.sleepCount=(Number(state.sleepCount)||0)+1; let route; if(/早起|明天|招聘会/.test(command)) route=5; else if(state.energy<50) route=0; else if(/若有所思|紧绷/.test(state.mood)) route=1; else route=[2,3,4,0][state.sleepCount%4]; if(route===state.lastSleepRoute) route=(route+1)%5; state.lastSleepRoute=route; const nights=[['后脑勺碰到枕头，肩膀先往下塌。手指把被子拉到胸口，脚尖碰到床尾那块凉布，过了一会儿才被体温焐热。','耳朵里的衣料摩擦声先停下，冰箱压缩机低低嗡了一阵又断开；更远的车流从密变疏，地铁钻过地下时墙面轻轻颤了一下。'],['左肩压麻后挪向另一边，床垫弹簧在腰侧响了一声，又把震动慢慢吞掉。指腹在手机壳上停了片刻，屏幕没有亮。','耳朵收着水管一阵短促的水声、隔壁门轴轻响和楼下车轮碾过井盖的哐当；车声一趟趟远去，眼皮才慢慢沉下来。'],['眼皮刚合上，楼道门锁猛地弹回，闷响穿过门缝。肩膀一缩，呼吸停了半拍，手机在床头柜上震了三秒又安静。','耳朵听着楼上脚步从近到远，空调外机的嗡鸣由强变弱；更远处夜班公交刹了一下，尖响拖过街口，房间才重新暗下去。'],['眼睛在黑里睁开，喉咙干得发黏。手指够到手机，屏幕亮出3:42，蓝光从指节滑到被角。','耳朵里只剩呼吸和被子摩擦声，冰箱停机后房间更静；远处一辆货车由远到近压过路口，又把低频带走。'],['指腹按亮手机又按灭，屏幕上的时间从01:18跳到02:06。后背贴着潮热的床单，翻身时床架在腿侧轻轻响。','耳朵反复收进吞咽声、窗框被风拨动的轻碰、楼上椅脚拖过地板和远处稀疏的车流；天色从黑沉成深蓝，声音才一点点散开。'],['指尖碰到闹钟侧键，7:30的数字亮在掌心里。被子掀开时凉气先贴上小腿，鞋跟落地，地板在脚下发出短响。','耳朵听见手机提示音停下，水管里有人放水，楼下早点摊的铁勺敲着锅沿；远处地铁的闷响刚过去，窗帘已经被晨风鼓起一角。']]; const weatherPenalty=/小雨|风起/.test(state.weather||'')?2:0; const gain=Math.max(4,[24,16,14,17,6,20][route]-weatherPenalty); const weatherWake=/小雨/.test(state.weather||'')?'耳朵里先落进空调外机上断续的雨点，窗帘边缘被潮气压得发暗。':'皮肤碰到窗缝钻进来的空气，'+(state.weather||'多云')+'的凉意贴在手背上。'; const wake=['眼皮先碰到灰白的光，窗帘缝把它切成细条，斜着压在脸侧。后脑勺还陷在枕头里，右臂压麻，手指弯了两次才慢慢回温。',weatherWake,'耳朵最先收进楼下早点摊铁勺敲锅沿的脆响，近处水管跟着冲过去，隔壁门锁转了一下又松开；远处的公交声由闷变轻。','手背摸到床头柜边缘，昨晚那杯水已经凉透，杯壁水珠把木头浸出一小圈深色。手机亮着，电量剩41%，两条未读消息挤在锁屏上。']; state.time='2019年9月15日，周日 '+(route===4?'06:08':route===5?'06:50':'07:32'); state.energy=Math.min(100,state.energy+gain); state.mood=route===4?'发沉':route===1?'醒得很浅':'还没完全醒'; const trace=dailyPulse(); updateHud(); await typeStory([...nights[route],...wake,trace],'V11 夜间 · 第二天早晨'); footnote(['⚪ '+state.time+'｜'+(state.weather||'多云')+'｜体力 '+state.energy+'%','🟡 '+state.objectMemory,'🟢 第 '+state.sleepCount+' 次过夜，身体会把昨晚的睡眠质量带进今天。']); addChoices([{label:'摸到手机点开未读——屏幕的冷光会把字映到指节上',run:()=>nextScene('查看未读消息')},{label:'撑起身去烧水——水壶的绿灯会先在厨房亮起来',run:()=>nextScene('烧水洗杯子')},{label:'把窗帘拉开一掌宽——楼下的早点摊会露出一截蒸汽',run:()=>nextScene('拉开窗帘')}],'清晨已经向前走：'); }
    async function intro() { $('feed').innerHTML='<div class="date-break">新的对话</div>'; await typeStory(['🟤【都市】','«这一次，过去不会替你决定明天。\n你真正走过的路，会留在脚下。»','🟢【① 爽玩 · 推荐】\n机会更愿意回应准备，代价仍然会按时抵达。','🔵【② 沉浸】\n愿望与现实并行，关系、资源和风险自然发展。','🔴【③ 硬核】\n时间、体力、人情和账户余额都不会替你留情。'],'体验模式选择'); addChoices([{label:'爽玩 · 让有效的计划更快得到回应',run:()=>chooseMode('爽玩')},{label:'沉浸 · 让城市按自己的节奏向前',run:()=>chooseMode('沉浸')},{label:'硬核 · 用更严苛的条件开始生活',run:()=>chooseMode('硬核')}],'选择一种抵达方式：'); }
    async function chooseMode(mode) { state.mode=mode; state.stage='entry'; document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage('选择 '+mode+' 模式。'); await typeStory(['🟤【选择踏入这座城市的那一天】','① 初到北京\n拖着行李箱，兜里没多少钱，地铁口的风先吹乱了衣角。','② 相遇之后\n已经住进同一套房子，却还没有人知道谁会先留下。','③ 关系转折点\n一句没说完的话、一场迟到的雨，或者一次没能避开的争吵。','🟣【选择身份】\n从此刻起，城市会记住你用什么身份推开那扇门。'],'城市入口'); addChoices([{label:'初到北京 · 原创北漂青年',run:()=>begin('初到北京','原创北漂青年')},{label:'相遇之后 · 合租室友',run:()=>begin('相遇之后','合租室友')},{label:'关系转折点 · 职场同事',run:()=>begin('关系转折点','职场同事')},{label:'自定义身份 · 在输入框描述你是谁',run:()=>customIdentity()}],'选一个入口，或者写下自己的来处：'); }
    function customIdentity() { document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); state.stage='custom'; playerMessage('我想以自己的身份进入。'); typeStory(['说一个名字、一份正在做的工作，或者一件你今晚还没解决的事。\n不需要把一生都交代完。'],'城市入口'); }
    async function begin(entry,identity,customText='') { state.entry=entry; state.identity=identity; state.stage='scene'; if(identity==='合租室友') Object.assign(state,{name:'陈放',job:'自由摄影师',money:4100,energy:70}); if(identity==='职场同事') Object.assign(state,{name:'林简',job:'品牌策划',money:5300,energy:67}); if(customText) { const clean=customText.slice(0,32); state.name='周予安'; state.job=clean.includes('程序')?'程序员':clean.includes('咖啡')?'咖啡师':'自由职业者'; state.mood='还没安顿好'; } document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage(`${entry} · ${identity}`); updateHud(); await sceneOne(); }
    async function sceneOne() { await typeStory(['视线先越过楼道尽头忽明忽暗的感应灯，才收回到拧在锁孔里的手指。金属凉得发黏，倒刺被钥匙硌出一粒小血珠，拇指蹭过去，疼意顺着指节往上走。','肩膀压着行李箱往里挪，轮子先撞门槛又滑过地板；水壶盖子在厨房连跳两下，隔壁洗衣机的轰鸣从重到轻，旧木头和潮气跟着箱轮翻起来。','“鞋放门边就行。”她从灶台前转过身，把钥匙放到桌面。钥匙串转了半圈才停，水珠顺着她的手背掉下去，在桌布上洇开一个深点。','耳朵里灌进公交压过积水的声音，橘黄的光从纱窗左边扫到右边。手指碰到手机壳边缘，指纹第一次没识别，手背蹭过屏幕后再滑开微信：陈放刚发来消息，<em>明天下午望京有个招聘会，要不要一起？</em>'],'第一幕 · 入住'); footnote(['⚪ 北京·朝阳区·老小区·出租屋｜周六 18:10','🟢 存款：'+state.money+'元｜钥匙已在桌上','🟡 明天下午的招聘会，可能是一条路。']); state.intelTitle='🟡 未确认 · 招聘会'; state.intel='陈放说那里有几家公司在招人。你还没见到任何一个招聘方。'; updateHud(); addChoices([{label:'把行李推进房间——箱底会蹭过地板，床垫会先吃住肩背的重量',run:()=>act('收拾行李')},{label:'问她附近哪里方便找工作——灶火声会不会先停下来',run:()=>act('询问工作')},{label:'靠在门框上——等楼道的灯再亮一次，看脚步会停在哪一层',run:()=>act('观察楼道')}],'选择一段会继续向前的动作：'); }
    async function act(action) { if(typing) return; document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage(action); let lines=[], note=[]; if(action==='收拾行李') { state.energy-=5; state.mood='稍微踏实'; lines=['你把箱子靠到墙边，拉链上卡着的一根线头被扯断，落在地板上。床垫比想象中薄，坐下去时，弹簧在下面很轻地响了一声。','厨房里的水声停了。门外有人经过，鞋跟敲着水泥台阶，一下一下地往下走。','你把明天要穿的衬衫挂到衣柜门上。衣柜里有淡淡的樟脑味，门合上时没能严丝合缝。']; note=['⚪ 体力略有消耗｜房间可以住了','🟡 招聘会仍在明天下午']; } else if(action==='询问工作') { state.intelTitle='🔵 已确认 · 望京招聘会'; state.intel='沈晚把地址写在便利贴上，陈放约在下午两点的地铁站外。'; lines=['她从抽屉里找出一支笔，在便利贴上写了地址。笔尖划过纸面，沙沙的声音很轻。','“别穿得太随便。”她把纸推过来，指尖在桌面上停了一下，“那边人多，地铁会挤。”','她回厨房把火关了。锅里最后一点热气撞在玻璃窗上，很快散掉。']; note=['🔵 已确认：望京招聘会，明天下午两点','🟣 沈晚不再完全把你当陌生人']; } else if(action==='观察楼道') { state.energy=Math.max(45,state.energy-1); lines=['你没有立刻关门。楼道尽头的感应灯重新亮起来，冷白的光把墙皮剥落的边缘照得很清楚。','楼上有人拖着椅子，木腿擦过地板的声音贴着天花板走了一段；更远的地方，地铁进站时传来一阵压低的闷响。','门口那袋没扔的纸箱被风从窗缝吹得挪了半寸，纸角碰到墙根，留下一个浅浅的褐色印子。']; note=['⚪ 你在门口站了二十分钟｜楼道的灯亮过两次','🟡 隔壁房间还亮着一线光。']; } else { state.money-=22; state.energy=Math.min(100,state.energy+8); state.mood='暖和一些'; lines=['巷口的饭馆还亮着一盏白得发冷的灯。你端着一份刚炒好的盖饭站在门口，塑料盒烫得手指发红。','回到楼下时，沈晚正撑着伞从小区门口进来。她看见你手里的袋子，没问什么，只把伞往你这边偏了偏。','雨落在伞面上，细碎得像有人在不远处翻书。']; note=['🟢 支出：22元｜吃了一顿热饭','🟣 你们一起走过了一小段雨路']; }
      state.time='2019年9月14日，周六 20:05'; lines.push(dailyPulse()); updateHud(); await typeStory(lines,'城市'); footnote(note); addChoices([{label:'去厨房烧一壶水——水壶绿灯会在台面上亮起来',run:()=>nextScene('整理简历')},{label:'给陈放回消息——聊天框里那句“明天见”会先停在输入栏',run:()=>nextScene('确认见面')},{label:'把鞋尖抵着门槛——看玄关那把湿伞还会滴多久',run:()=>nextScene('观察痕迹')}]); }
    async function nextScene(action) { document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage(action); state.energy=Math.max(40,state.energy-4); state.time='2019年9月14日，周六 22:40'; state.intelTitle='🔵 已确认 · 明天的约定'; state.intel='陈放会在望京南站外等你。你需要自己准时抵达。'; const trace=dailyPulse(); updateHud(); await typeStory(['屋里的灯只开了一盏。你把手机放在膝盖上，屏幕的冷光照着没收拾完的行李，箱子拉杆在墙上投出一条细长的影子。','门外有人轻轻把垃圾袋提走，塑料摩擦地面的声音停在你的门口，又渐渐远了；楼下便利店的卷帘门被拉下一半，铁皮在夜里刮出一声长响。','你把闹钟调到七点半。按键回弹时，窗外一辆末班公交亮着两排暖黄的灯，从墙上的光块里慢慢驶过去。',trace],'第二幕 · 第一条路'); footnote(['⚪ '+state.time+'｜体力 '+state.energy+'%｜窗外路灯已亮','🟢 明天的见面已经确认','🟡 你可以让这盏灯再亮一会，也可以现在睡去。']); addChoices([{label:'去厨房烧一壶水——杯底会在水槽边磕出一声轻响',run:()=>nextScene('烧水洗杯子')},{label:'给陈放发一句“明天见”——光标会在聊天框里等着',run:()=>nextScene('确认见面')},{label:'坐在床沿数车灯——最后一辆公交会从窗帘缝里滑过去',run:()=>nextScene('看车灯')}],'夜已经往前走了一段：'); }
    async function handle(text) { if(!text||typing) return; $('command').value=''; if(state.stage==='mode') { const m=/硬核|3/.test(text)?'硬核':/沉浸|2/.test(text)?'沉浸':'爽玩'; return chooseMode(m); } if(state.stage==='entry') { if(/自定义|自己|随机/.test(text)) return customIdentity(); return begin('初到北京','原创北漂青年',text); } if(state.stage==='custom') return begin('自定义时间点','原创身份',text); if(/睡觉|睡了|睡吧|我先睡了|去睡了|明天|到第二天|过夜|天亮之后|第二天早上|过一天|推进时间|跳过今晚/.test(text)) return sleepToMorning(text); if(/查看.*状态|完整状态|状态/.test(text)) return showStatus(); if(/保存/.test(text)) return save(); if(/吃|饭|下楼|便利店/.test(text)) return act('下楼吃饭'); if(/房东|沈晚|问|聊/.test(text)) return act('询问工作'); if(/收拾|行李|房间/.test(text)) return act('收拾行李'); document.querySelectorAll('.choice-wrap').forEach(x=>x.remove()); playerMessage(text); state.energy=Math.max(35,state.energy-3); state.time='2019年9月14日，周六 21:10'; state.mood='若有所思'; const trace=dailyPulse(); updateHud(); await typeStory(['指腹离开刚碰过的纸张和金属，凉意还黏在纹路里。厨房水龙头被人拧开，近处的水声一层层盖过墙外的车流。','二十多分钟从墙上钟摆过去，桌上的半杯水凉了，杯壁外侧凝出一圈湿痕。楼下外卖车停在路灯下，红色尾灯把积水照得像一小块晃动的玻璃。','拇指压住手机边缘，屏幕扣到桌面，熄灭前的黑色反光里掠过窗帘摆动的影子。',trace],'城市'); footnote(['⚪ '+state.time+'｜体力 '+state.energy+'%｜桌上的水已经凉了。','🟡 这件事已经占去了今晚的一段时间。']); addChoices([{label:'站起来去洗把脸——凉水会沿着手腕流到袖口',run:()=>act('收拾行李')},{label:'翻开手机——未读消息会在屏幕顶端跳出来或消失',run:()=>act('询问工作')},{label:'什么也不做——听楼下车流从密到稀',run:()=>act('观察楼道')}]); }
    const baseHandle=handle; handle=async function(text) { if(text&&state.stage==='scene') { if(/手机|微信|消息|朋友圈|外卖|相册|音乐|短信|快递/.test(text)) return digitalLife(); if(/下楼|邻居|邻里|早餐|橘猫|猫|楼道|街坊/.test(text)) return neighborhoodLife(); } return baseHandle(text); };
    function save() { if(state.stage==='mode') return toast('先选择一种体验模式。'); localStorage.setItem('cityAfterDarkSave',JSON.stringify(state)); toast('🟢 V12 存档已存进这台设备的浏览器。'); }
    function showStatus() { const lines=['【V12都市终极完整存档】','模式：'+state.mode,'入口 / 阶段：'+state.entry+' / '+state.stage,'时间：'+state.time,'地点：'+state.place,'天气 / 生理节律：'+state.weather+'｜第 '+state.sleepCount+' 次过夜','角色 / 身份：'+state.name+' / '+state.identity,'职业：'+state.job,'存款 / 房租：'+state.money+'元 / '+state.rent,'状态：'+state.mood+'｜体力 '+state.energy+'%','物件痕迹：'+state.objectMemory,'声音记忆：'+state.soundMemory,'数字生活：'+state.digitalTrace,'街坊邻里：'+state.neighborhoodTrace,'截止日期：'+state.deadline,'已确认：'+state.intel,'【本轮进度叙事回顾】','出租屋里的灯、湿伞、未读消息与冰箱里的陌生牛奶仍在延续各自的变化。','身体状态、楼道的门锁声和邻里痕迹会带进下一次通勤与对话。']; $('promptView').textContent=lines.join('\n'); $('modal').classList.add('show'); }
    function reset() { if(confirm('要抹去这段未保存的生活，重新开始吗？')) { state=fresh(); updateHud(); intro(); } }
    async function copyPrompt() { try { await navigator.clipboard.writeText(prompt); toast('🟢 完整提示词已复制。'); } catch { $('promptView').textContent=prompt; $('modal').classList.add('show'); toast('⚪ 浏览器阻止自动复制，请在弹窗中手动复制。'); } }
    function openPrompt() { $('promptView').textContent=prompt; $('modal').classList.add('show'); }
    $('commandForm').addEventListener('submit',e=>{e.preventDefault();handle($('command').value.trim());}); $('promptBtn').onclick=openPrompt; $('mobilePrompt').onclick=openPrompt; $('copyBtn').onclick=copyPrompt; $('saveBtn').onclick=save; $('mobileSave').onclick=save; $('statusBtn').onclick=showStatus; $('resetBtn').onclick=reset; $('modalClose').onclick=()=>$('modal').classList.remove('show'); $('modal').onclick=e=>{if(e.target===$('modal')) $('modal').classList.remove('show');}; $('soundBtn').onclick=()=>{soundOn=!soundOn; $('soundBtn').innerHTML=soundOn?'<i class="icon icon-volume-x"></i> 静音':'<i class="icon icon-volume-2"></i> 环境声'; toast(soundOn?'⚪ 环境声已模拟开启。':'⚪ 环境声已关闭。');};
    const saved=localStorage.getItem('cityAfterDarkSave'); if(saved) { try { state={...fresh(),...JSON.parse(saved)}; } catch {} } updateHud(); intro();
  </script>
